<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Sojourn Access: Bearing. Directions as Access gives them, on a clock face around you: you at the centre, a sound
       at two o'clock rippling toward you. A pearl rim on deep teal. Drawn on a 256 grid by Claude Opus 5.5;
       data-min/data-max (px) choose detail per size (tools/icon.py); 24 px and under on 16's pixel grid. -->
  <defs>
    <linearGradient id="rim" x1="40" y1="20" x2="210" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#E2EDF3"/>
      <stop offset="1" stop-color="#A3BDCB"/>
    </linearGradient>
    <radialGradient id="face" cx="110" cy="100" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17617A"/>
      <stop offset="1" stop-color="#0A2E3D"/>
    </radialGradient>
    <radialGradient id="glow" cx="176" cy="100" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9BFFE6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9BFFE6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g data-min="25">
    <circle cx="128" cy="128" r="117" fill="#0B2633"/>
    <circle cx="128" cy="128" r="111" fill="url(#rim)"/>
    <circle cx="128" cy="128" r="93" fill="#0B2633"/>
    <circle cx="128" cy="128" r="90" fill="url(#face)"/>
    <!-- the hours; twelve longer and brighter -->
    <g data-min="48" stroke="#8FC6D2" stroke-width="5" stroke-linecap="round">
      <path d="M128 52 V44" transform="rotate(30 128 128)"/><path d="M128 52 V44" transform="rotate(60 128 128)"/>
      <path d="M128 52 V44" transform="rotate(90 128 128)"/><path d="M128 52 V44" transform="rotate(120 128 128)"/>
      <path d="M128 52 V44" transform="rotate(150 128 128)"/><path d="M128 52 V44" transform="rotate(180 128 128)"/>
      <path d="M128 52 V44" transform="rotate(210 128 128)"/><path d="M128 52 V44" transform="rotate(240 128 128)"/>
      <path d="M128 52 V44" transform="rotate(270 128 128)"/><path d="M128 52 V44" transform="rotate(300 128 128)"/>
      <path d="M128 52 V44" transform="rotate(330 128 128)"/>
    </g>
    <path d="M128 58 V44" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <!-- the sound at two o'clock and its ripples toward the centre -->
    <circle data-min="48" cx="176" cy="100" r="40" fill="url(#glow)"/>
    <path d="M163.9 133.9 A36 36 0 0 1 140.5 94.0" fill="none" stroke="#7DEFD6" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
    <path d="M168.6 120.7 A22 22 0 0 1 154.3 96.3" fill="none" stroke="#7DEFD6" stroke-width="7" stroke-linecap="round"/>
    <circle cx="176" cy="100" r="12" fill="#9BFFE6"/>
    <!-- you -->
    <circle cx="128" cy="128" r="14" fill="url(#rim)"/>
  </g>

  <!-- 24 px and under: on 16's pixel grid (a pixel is 16 units) -->
  <g data-max="24">
    <circle cx="128" cy="128" r="116" fill="#0B2633"/>
    <circle cx="128" cy="128" r="100" fill="#DCE8EF"/>
    <circle cx="128" cy="128" r="80" fill="#0F4357"/>
    <rect x="112" y="48" width="32" height="16" fill="#FFFFFF"/>
    <rect x="112" y="112" width="32" height="32" fill="#FFFFFF"/>
    <rect x="160" y="80" width="32" height="32" fill="#8CF7DE"/>
  </g>
</svg>
