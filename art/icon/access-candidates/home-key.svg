<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Sojourn Access: Home Key. A keycap with the short raised bar that F and J carry, how touch-typists find their place
       without looking. Pearl, as Sojourn is, with a deep face for contrast. Drawn on a 256 grid by Claude Opus 5.5;
       data-min/data-max (px) choose detail per size (tools/icon.py); 24 px and under on 16's pixel grid. -->
  <defs>
    <linearGradient id="face" x1="70" y1="52" x2="190" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2D5378"/>
      <stop offset="1" stop-color="#11273F"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="136" x2="0" y2="156" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9DCEC"/>
    </linearGradient>
    <radialGradient id="shadow" cx="128" cy="236" r="100" gradientTransform="translate(128 236) scale(1 0.09) translate(-128 -236)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E2233" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0E2233" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cap"><rect x="29" y="41" width="198" height="184" rx="39"/></clipPath>
    <linearGradient id="front" x1="0" y1="174" x2="0" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DCE6EF"/>
      <stop offset="1" stop-color="#C2D3E2"/>
    </linearGradient>
  </defs>

  <g data-min="25">
    <ellipse data-min="64" cx="128" cy="236" rx="100" ry="9" fill="url(#shadow)"/>
    <rect x="22" y="34" width="212" height="198" rx="46" fill="#12283F"/>
    <!-- the cap's four slopes, lit from the upper left -->
    <g clip-path="url(#cap)">
      <path d="M29 41 H227 L200 46 H56 Z" fill="#FFFFFF"/>
      <path d="M29 41 L56 46 V174 L29 225 Z" fill="#E9F0F6"/>
      <path d="M227 41 L200 46 V174 L227 225 Z" fill="#B4C7D8"/>
      <path d="M29 225 L56 174 H200 L227 225 Z" fill="url(#front)"/>
    </g>
    <rect x="56" y="46" width="144" height="128" rx="28" fill="#12283F"/>
    <rect x="59" y="49" width="138" height="122" rx="25" fill="url(#face)"/>
    <path data-min="64" d="M86 55 H170 Q188 55 190 70" fill="none" stroke="#6F93B8" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>
    <rect data-min="48" x="104" y="137" width="48" height="16" rx="8" fill="#06111D" opacity="0.6"/>
    <rect x="104" y="131" width="48" height="16" rx="8" fill="url(#ridge)"/>
  </g>

  <!-- 24 px and under: on 16's pixel grid (a pixel is 16 units) -->
  <g data-max="24">
    <rect x="16" y="16" width="224" height="224" rx="48" fill="#12283F"/>
    <rect x="32" y="32" width="192" height="192" rx="32" fill="#E4EDF5"/>
    <rect x="32" y="160" width="192" height="64" rx="16" fill="#B3C6D8"/>
    <rect x="48" y="32" width="160" height="16" fill="#FFFFFF"/>
    <rect x="48" y="48" width="160" height="112" rx="16" fill="#1D3B5A"/>
    <rect x="96" y="128" width="64" height="16" fill="#FFFFFF"/>
  </g>
</svg>
