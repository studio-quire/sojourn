<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Sojourn Access: Echo. Sojourn's doorway, drawn in sound: the arch repeated inward as echoes (or as doors
       receding). Sojourn's pearl and blue inverted for contrast. Drawn on a 256 grid by Claude Opus 5.5;
       data-min/data-max (px) choose detail per size (tools/icon.py); 24 px and under on 16's pixel grid. -->
  <defs>
    <linearGradient id="deep" x1="0" y1="24" x2="0" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22507D"/>
      <stop offset="1" stop-color="#0F2640"/>
    </linearGradient>
    <linearGradient id="pearl" x1="56" y1="24" x2="200" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#EDF3F8"/>
      <stop offset="1" stop-color="#C6D7E5"/>
    </linearGradient>
    <radialGradient id="shadow" cx="128" cy="238" r="96" gradientTransform="translate(128 238) scale(1 0.09) translate(-128 -238)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E2233" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0E2233" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g data-min="25">
    <ellipse data-min="64" cx="128" cy="238" rx="96" ry="8" fill="url(#shadow)"/>
    <path d="M36 112 A92 92 0 0 1 220 112 V236 H36 Z" fill="#C6D7E5"/>
    <path d="M40 112 A88 88 0 0 1 216 112 V232 H40 Z" fill="#0E2236"/>
    <path d="M45 112 A83 83 0 0 1 211 112 V227 H45 Z" fill="url(#deep)"/>
    <path d="M65 227 V112 A63 63 0 0 1 191 112 V227" fill="none" stroke="url(#pearl)" stroke-width="13"/>
    <path d="M89 227 V112 A39 39 0 0 1 167 112 V227" fill="none" stroke="#BFE0F5" stroke-width="13"/>
    <path d="M113 227 V112 A15 15 0 0 1 143 112 V227 Z" fill="#8CC5EC"/>
  </g>

  <!-- 24 px and under: on 16's pixel grid (a pixel is 16 units) -->
  <g data-max="24">
    <path d="M32 112 A96 96 0 0 1 224 112 V240 H32 Z" fill="#0E2236"/>
    <path d="M56 224 V112 A72 72 0 0 1 200 112 V224" fill="none" stroke="#F4F8FB" stroke-width="16"/>
    <path d="M112 224 V112 A16 16 0 0 1 144 112 V224 Z" fill="#9CCDF0"/>
  </g>
</svg>
