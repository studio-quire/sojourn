<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Sojourn: Threshold. A pearl doorway, and through it a way to a far horizon at blue hour.
       Drawn on a 256 grid; data-min/data-max (px) choose detail per size (tools/icon.py): 16 and 24 px have their own
       shapes on their pixel grids, with an outline a pixel wide. -->
  <defs>
    <linearGradient id="pearl" x1="56" y1="24" x2="200" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#EDF3F8"/>
      <stop offset="1" stop-color="#C6D7E5"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="40" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4C84BC"/>
      <stop offset="0.7" stop-color="#A9CFEC"/>
      <stop offset="1" stop-color="#DDEFFA"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="160" x2="0" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FB2DA"/>
      <stop offset="1" stop-color="#2C6290"/>
    </linearGradient>
    <linearGradient id="way" x1="0" y1="160" x2="0" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#F6FAFD"/>
    </linearGradient>
    <linearGradient id="reveal" x1="74" y1="0" x2="94" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E4467" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1E4467" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow" cx="128" cy="238" r="84" gradientTransform="translate(128 238) scale(1 0.1) translate(-128 -238)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E2233" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0E2233" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="150" cy="92" r="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 32 px and up -->
  <g data-min="32">
    <ellipse data-min="64" cx="128" cy="238" rx="84" ry="8" fill="url(#shadow)"/>
    <!-- the frame, its edge an inset band: 8 units (a pixel at 32) up to 48 px, finer above -->
    <path d="M56 96 A72 72 0 0 1 200 96 V226 Q200 236 190 236 H66 Q56 236 56 226 Z" fill="#5F7F9A"/>
    <path data-max="48" d="M63 96 A65 65 0 0 1 193 96 V226 Q193 229 190 229 H66 Q63 229 63 226 Z" fill="url(#pearl)"/>
    <path data-min="64" d="M59 96 A69 69 0 0 1 197 96 V226 Q197 233 190 233 H66 Q59 233 59 226 Z" fill="url(#pearl)"/>
    <path data-min="64" d="M62 96 A66 66 0 0 1 194 96" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <!-- the view -->
    <path d="M76 218 V96 A52 52 0 0 1 180 96 V218 Z" fill="url(#sky)"/>
    <circle data-min="48" cx="150" cy="92" r="20" fill="url(#halo)"/>
    <circle data-min="48" cx="150" cy="92" r="7" fill="#F7FBFE"/>
    <rect x="76" y="160" width="104" height="58" fill="url(#sea)"/>
    <path d="M100 218 L126 160 H130 L156 218 Z" fill="url(#way)"/>
    <path data-min="64" d="M76 218 V96 A52 52 0 0 1 92 58.6 L96 64 A46 46 0 0 0 82 96 V218 Z" fill="url(#reveal)"/>
    <path d="M76 218 V96 A52 52 0 0 1 180 96 V218" fill="none" stroke="#5F7F9A" stroke-width="3"/>
  </g>

  <!-- 20-24 px: on 24's pixel grid (a pixel is 10.67 units) -->
  <g data-min="20" data-max="24">
    <path d="M53.3 101.3 A74.7 74.7 0 0 1 202.7 101.3 V234.7 H53.3 Z" fill="#5F7F9A"/>
    <path d="M64 101.3 A64 64 0 0 1 192 101.3 V224 H64 Z" fill="url(#pearl)"/>
    <path d="M85.3 213.3 V106.7 A42.7 42.7 0 0 1 170.7 106.7 V213.3 Z" fill="#8FC0E6"/>
    <rect x="85.3" y="160" width="85.4" height="53.3" fill="#3F78A9"/>
    <path d="M106.7 213.3 L122.7 160 H133.3 L149.3 213.3 Z" fill="#FFFFFF"/>
  </g>

  <!-- 16 px: on its pixel grid (a pixel is 16 units) -->
  <g data-max="16">
    <path d="M48 112 A80 80 0 0 1 208 112 V240 H48 Z" fill="#5F7F9A"/>
    <path d="M64 112 A64 64 0 0 1 192 112 V224 H64 Z" fill="url(#pearl)"/>
    <path d="M80 224 V120 A48 48 0 0 1 176 120 V224 Z" fill="#8FC0E6"/>
    <rect x="80" y="160" width="96" height="64" fill="#3F78A9"/>
    <path d="M104 224 L120 160 H136 L152 224 Z" fill="#FFFFFF"/>
  </g>
</svg>
